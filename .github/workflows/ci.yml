name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:cov

      - name: Build (library + docs)
        run: npm run build

      - name: Assert library declarations emitted
        run: test -f dist/index.d.ts && test -f dist/bedrock/index.d.ts

      # Run the import-graph guard as its own step, so a regression that lets the
      # default entry reach @aws-sdk/* is named in the log rather than buried in
      # the full suite's output.
      - name: Assert the default entry is SDK-free
        run: npx vitest run src/core/isolation.test.ts

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
