name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:cov

      # The half of pin hygiene that needs the network, so it can't live in the
      # (hermetic) vitest suite: does each pin's `# vX.Y.Z` actually name the tag
      # its SHA carries? A wrong label is worse than none — it makes a
      # major-version jump read as a routine same-line bump, which is how a
      # checkout v6 -> v7.0.1 bump nearly landed in nf-spawn labelled `# v6`.
      # Read-only (git ls-remote), no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh

      - name: Build (library + docs)
        run: npm run build

      - name: Assert library declarations emitted
        run: test -f dist/index.d.ts && test -f dist/bedrock/index.d.ts

      # Run the import-graph guard as its own step, so a regression that lets the
      # default entry reach @aws-sdk/* is named in the log rather than buried in
      # the full suite's output.
      - name: Assert the default entry is SDK-free
        run: npx vitest run src/core/isolation.test.ts

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
